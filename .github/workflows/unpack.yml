name: Unpack Update and Build APK

on:
  push:
    paths:
      - 'update.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack update.zip safely
        if: hashFiles('update.zip') != ''
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('update.zip') as z:
              for item in z.infolist():
                  p = Path(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'Unsafe ZIP path: {item.filename}')
              z.extractall('.')
          PY

      - name: Commit source changes without retriggering on update.zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!update.zip'
          if ! git diff --cached --quiet; then
            git commit -m "Apply ArtStudio source update"
            git push
          else
            echo "No source changes to commit"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtStudio-by-Topz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
